<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111816"><link rel="icon" href="data:,"><title>RANGE 60 · 合成音效台</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;background:#101513;color:#edf0e9;--mint:#bff28a;--line:#34433b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 72% 0%,#1d2a26 0,#121917 40%,#0e1312 100%)}main{max-width:1250px;margin:auto;padding:38px clamp(18px,5vw,68px) 42px}header{display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px;margin-bottom:22px}.eyebrow{font:11px "Courier New",monospace;letter-spacing:.22em;color:var(--mint)}h1{font-size:clamp(30px,5vw,58px);letter-spacing:-.055em;margin:13px 0 7px}header p{margin:0;color:#a5b2aa;font-size:14px}.logo{align-self:start;border:1px solid #516058;padding:10px 14px;color:#b8c3bc;font:12px "Courier New",monospace;letter-spacing:.11em}.scope{height:140px;border:1px solid var(--line);background:#101715;border-radius:8px;overflow:hidden;position:relative;margin-bottom:22px}.scope::before{content:"TIME DOMAIN / FFT";position:absolute;top:11px;left:14px;color:#84958a;font:10px "Courier New",monospace;letter-spacing:.12em;z-index:1}.scope canvas{width:100%;height:100%;display:block}.status{font:11px "Courier New",monospace;color:var(--mint);letter-spacing:.12em;margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.grid button{min-height:112px;position:relative;text-align:left;color:inherit;background:linear-gradient(140deg,#1a231f,#131a17);border:1px solid #36453d;border-radius:7px;padding:16px 15px;cursor:pointer;transition:transform .16s,border-color .16s,background .16s;overflow:hidden}.grid button::before{content:"";position:absolute;inset:auto 0 0;height:2px;background:var(--mint);transform:scaleX(0);transform-origin:left;transition:transform .22s}.grid button:hover{border-color:#77917c;transform:translateY(-2px);background:#202b25}.grid button.playing{border-color:#bff28a;background:#1e2b22;box-shadow:0 0 22px #bff28a16}.grid button.playing::before{transform:scaleX(1)}.grid span,.grid small,.grid i{display:block}.grid span{font-weight:650;font-size:15px}.grid small{color:#96a49a;margin-top:7px;font-size:12px}.grid i{position:absolute;right:14px;top:15px;color:#bff28a;font:10px "Courier New",monospace;letter-spacing:.12em}footer{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:20px;color:#849188;font-size:12px}footer button{border:1px solid #46544d;background:#171f1b;border-radius:5px;color:#dae1da;padding:9px 14px;cursor:pointer}footer button:hover{border-color:var(--mint);color:var(--mint)}@media(max-width:790px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:440px){main{padding-top:25px}.grid{gap:7px}.grid button{padding:13px 11px;min-height:102px}.grid i{right:10px;top:13px}footer{align-items:flex-start;line-height:1.55}}
</style></head><body><main><header><div><div class="eyebrow">RANGE 60 / PROCEDURAL AUDIO LAB</div><h1>合成音效台</h1><p>振荡器 · 实时噪声 · 滤波器 · 动态混响</p></div><div class="logo">NO AUDIO FILES<br>WEB AUDIO ONLY</div></header><div class="scope"><canvas id="scope"></canvas></div><p id="state" class="status">READY · CLICK ANY SOUND TO START</p><section id="sounds" class="grid" aria-label="合成游戏音效"></section><footer><span>每次点击会依次演绎 3 种随机音色变化</span><button id="silence">静音 / 暂停</button></footer></main><script>/* BUNDLE */</script></body></html>

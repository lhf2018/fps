const spinButton=document.querySelector('#spin');
spinButton.setAttribute('aria-pressed',spin);
spinButton.addEventListener('click',()=>{spin=!spin;spinButton.setAttribute('aria-pressed',spin);});
const buttons=[...document.querySelectorAll('[data-view]')];
for(const button of buttons)button.addEventListener('click',()=>{
  view=Number(button.dataset.view);
  buttons.forEach(item=>item.setAttribute('aria-pressed',item===button));
  [,targetYaw,targetPitch,targetRadius]=views[view];
  drift=0;
});
const surface=renderer.domElement;
let drag=null;
surface.addEventListener('pointerdown',e=>{
  if(drag || e.button!==0)return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY};
  surface.setPointerCapture(e.pointerId);
});
surface.addEventListener('pointermove',e=>{
  if(drag?.id!==e.pointerId)return;
  targetYaw=clamp(targetYaw+(drag.x-e.clientX)*.007,-1.22,1.22);
  targetPitch=clamp(targetPitch+(e.clientY-drag.y)*.006,.065,1.1);
  drag.x=e.clientX;drag.y=e.clientY;
  drift=0;
});
for(const event of ['pointerup','pointercancel','lostpointercapture']){
  surface.addEventListener(event,e=>{if(drag?.id===e.pointerId)drag=null;});
}
surface.addEventListener('wheel',e=>{
  e.preventDefault();
  targetRadius=clamp(targetRadius*Math.exp(e.deltaY*.001),Math.max(1.25,views[view][3]*.65),22);
},{passive:false});
function resize(){
  camera.aspect=innerWidth/innerHeight;
  camera.fov=camera.aspect<.85?57:43;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);
  const w=Math.min(680,Math.max(280,Math.round(innerWidth*.58)));
  reflection.setSize(w,Math.min(680,Math.max(180,Math.round(w/camera.aspect))));
}
addEventListener('resize',resize);
resize();
let previous=performance.now(),first=true;
renderer.setAnimationLoop(now=>{
  const dt=Math.min(.1,Math.max(0,(now-previous)*.001));previous=now;
  waterTime.value+=dt;
  if(spin&&!drag)drift+=dt*.095;
  const blend=1-Math.exp(-dt*6);
  focus.lerp(views[view][0],blend);
  yaw=mix(yaw,targetYaw,blend);pitch=mix(pitch,targetPitch,blend);radius=mix(radius,targetRadius,blend);
  const a=yaw+Math.sin(drift)*.28, d=radius*Math.max(1,.90/camera.aspect);
  camera.position.set(focus.x+Math.sin(a)*Math.cos(pitch)*d,focus.y+Math.sin(pitch)*d,focus.z+Math.cos(a)*Math.cos(pitch)*d);
  camera.lookAt(focus);
  try {
    if(first){renderer.render(scene,camera);renderer.shadowMap.autoUpdate=false;}
    renderReflection(focus);
    renderer.render(scene,camera);
    if(first){first=false;status.hidden=true;}
  } catch(error) {
    renderer.setAnimationLoop(null);
    status.hidden=false;
    status.textContent='场景渲染失败，请使用支持 WebGL 2 的浏览器。';
    console.error(error);
  }
});
} catch(error) {
  status.textContent='无法启动场景，请检查 CDN 连接和浏览器的 WebGL 2 支持。';
  console.error(error);
}
</script>
</body>

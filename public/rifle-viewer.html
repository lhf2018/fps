ground();const covers={hesco:hesco(),jersey:jersey(),steel:steelCover(),pallet:palletCrates()};const labels={all:'FULL COVER LINE',hesco:'HESCO GABION / 1.37 M',jersey:'JERSEY BARRIER / 2.44 M',steel:'STEEL FIRING COVER / 2.26 M',pallet:'CARGO PALLET / 1.84 M'};let selected='all';
const sky=new THREE.Mesh(new THREE.SphereGeometry(40,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,vertexShader:'varying vec3 v;void main(){v=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 v;void main(){float h=max(normalize(v).y,0.);vec3 c=mix(vec3(.025,.041,.045),vec3(.20,.29,.31),smoothstep(0.,.9,h));gl_FragColor=vec4(c,1.);}'}));scene.add(sky);scene.add(new THREE.HemisphereLight(0x9db8c4,0x3c3329,2.3));const key=new THREE.DirectionalLight(0xffbf75,5.2);key.position.set(-6,10,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-16;key.shadow.camera.right=16;key.shadow.camera.top=14;key.shadow.camera.bottom=-14;scene.add(key);const rim=new THREE.DirectionalLight(0x81a8c7,2.2);rim.position.set(8,6,-12);scene.add(rim);const warm=new THREE.PointLight(0xff9b4a,4.2,12);warm.position.set(-6,2.8,-1);scene.add(warm);const cold=new THREE.PointLight(0x4f9fc6,3.2,14);cold.position.set(6,3,3);scene.add(cold);const renderTarget=new THREE.WebGLRenderTarget(innerWidth*devicePixelRatio,innerHeight*devicePixelRatio,{depthBuffer:true});const postScene=new THREE.Scene(),postCamera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);const postUniforms={tDiffuse:{value:renderTarget.texture},uTime:{value:0}};const postMaterial=new THREE.ShaderMaterial({uniforms:postUniforms,vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}',fragmentShader:'uniform sampler2D tDiffuse;uniform float uTime;varying vec2 vUv;void main(){vec2 p=vUv-.5;float vignette=1.-smoothstep(.28,.78,length(p));vec2 aberration=p*.0018*(.35+vignette);vec3 c;c.r=texture2D(tDiffuse,vUv+aberration).r;c.g=texture2D(tDiffuse,vUv).g;c.b=texture2D(tDiffuse,vUv-aberration).b;float grain=fract(sin(dot(vUv+uTime,vec2(12.9898,78.233)))*43758.5453);c*=1.08+.28*vignette;c+=grain*.012;gl_FragColor=vec4(c,1.);}'});postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMaterial));
const target=new THREE.Vector3(0,.65,0),spherical=new THREE.Spherical(11,1.09,.2);let dragging=false,lastX=0,lastY=0,auto=false;function applyCamera(){camera.position.setFromSpherical(spherical).add(target);camera.lookAt(target)}function resetView(){spherical.set(11,1.09,.2);applyCamera()}function selectCover(name){selected=name;for(const [key,g]of Object.entries(covers))g.visible=name==='all'||key===name;document.querySelector('#active').textContent=labels[name];document.querySelectorAll('[data-cover]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cover===name)));resetView()}document.querySelectorAll('[data-cover]').forEach(b=>b.onclick=()=>selectCover(b.dataset.cover));renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;spherical.theta-=(e.clientX-lastX)*.008;spherical.phi=THREE.MathUtils.clamp(spherical.phi+(e.clientY-lastY)*.006,.42,1.48);lastX=e.clientX;lastY=e.clientY;applyCamera()});renderer.domElement.addEventListener('pointerup',e=>{dragging=false;renderer.domElement.releasePointerCapture(e.pointerId)});renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();spherical.radius=THREE.MathUtils.clamp(spherical.radius*Math.exp(e.deltaY*.001),4.8,22);applyCamera()},{passive:false});renderer.domElement.addEventListener('dblclick',resetView);document.querySelector('#reset').onclick=resetView;document.querySelector('#spin').onclick=()=>{auto=!auto;document.querySelector('#spin').setAttribute('aria-pressed',String(auto))};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);renderTarget.setSize(innerWidth*devicePixelRatio,innerHeight*devicePixelRatio)});resetView();const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=clock.getDelta(),time=clock.elapsedTime;gri
